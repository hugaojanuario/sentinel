services:
  sentinel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=${PORT:-9090}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sentinel
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:-secret}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_CPU_THRESHOLD=${ALERT_CPU_THRESHOLD:-80}
      - ALERT_MEM_THRESHOLD_MB=${ALERT_MEM_THRESHOLD_MB:-500}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-30s}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    command:
      - -path=/migrations
      - -database
      - postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/sentinel?sslmode=disable
      - up
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./www
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - sentinel-backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d sentinel" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: